# 声明式策略基线示例：一个典型的三接口网关
#
#   eth0 = wan  (不可信，接入互联网)
#   eth1 = lan  (可信内网)
#   eth2 = dmz  (缓冲区分段，对外提供服务)
#
# 语义要点：
#   - 域的网段只在"该域未绑定接口"时参与匹配；绑定接口时以接口为边界。
#   - zone 名 local 表示防火墙本机；any / 空 表示不施加该方向约束。
#   - default 是各内置链的兜底策略，务必保持 forward: drop。

version: 1

# 地址组：承载"几万条 CIDR"这类列表（国家封锁、威胁情报订阅、大网段清单）。
#
# 这些地址不能写进规则的地址列表 —— 那会被内联进规则文本，几万条会让
# 规则集爆炸；地址组编译成 nft 区间集合，查找是 O(1)。
#
# 文件格式：每行一个 CIDR 或 IP，`#` 起注释。
# 国家列表可以从 ipdeny.com 下载（如 cn-aggregated.zone），或用官方工具
# 从 GeoLite2 导出 —— 本工具只负责加载，不解析 MMDB。
#
# 规则用 src_group / dst_group 引用；fwdd 每 30 分钟自动重读文件，
# 内容变化后只更新期望状态，由你决定何时 apply。
addr_groups: []
#  addr_groups:
#    - name: cn
#      file: /etc/fwdd/geoip/CN.cidr
#      comment: 某国地址段
#    - name: threat
#      file: /etc/fwdd/lists/threat.cidr
#    - name: small
#      cidrs: [10.0.0.0/8, 192.168.0.0/16]   # 少量地址用内联

zones:
  - name: wan
    interfaces: [eth0]
    trust: untrusted
  - name: lan
    interfaces: [eth1]
    trust: lan
  - name: dmz
    interfaces: [eth2]
    trust: dmz

rules:
  # ---- 放行已建立连接（网关必备，否则回包会被丢弃）----
  - id: est-rel
    priority: 1
    src_zone: any
    dst_zone: any
    state: [established, related]
    action: accept
    comment: 已建立/相关连接的快速通道

  # ---- 内网出访 ----
  - id: lan-to-wan
    priority: 100
    src_zone: lan
    dst_zone: wan
    action: accept
    comment: 内网访问互联网

  - id: lan-to-dmz-web
    priority: 110
    src_zone: lan
    dst_zone: dmz
    proto: tcp
    dst_port: ["80", "443"]
    state: [new]
    action: accept
    comment: 内网访问 DMZ 的 Web

  # ---- 外网进内网：只放行已建立，其余明确拒绝 ----
  - id: wan-to-dmz-web
    priority: 200
    src_zone: wan
    dst_zone: dmz
    proto: tcp
    dst_port: ["80", "443"]
    state: [new]
    action: accept
    limit: {rate: 200, per: second, burst: 400}
    comment: 外网访问 DMZ Web（带源无关的全局限速）

  - id: wan-deny-dmz
    priority: 250
    src_zone: wan
    dst_zone: dmz
    action: log
    log_prefix: "fw-deny-wan-dmz: "
    comment: 记录其余外网到 DMZ 的尝试

  # ---- 抗 DDoS：两道独立的防线 ----
  #
  # limit.rate       拦"连接建得太快"（令牌桶）
  # limit.max_concurrent 拦"连接建得太多且不释放"（ct count）
  #
  # 慢速攻击（slowloris 一类）每秒只建几个连接，速率限制完全看不出来，
  # 但并发连接数会一路涨上去 —— 所以这两个要一起配。
  - id: wan-slowloris
    priority: 260
    src_zone: wan
    dst_zone: dmz
    proto: tcp
    dst_port: ["80", "443"]
    state: [new]
    action: drop
    limit:
      rate: 30            # 每源每秒最多 30 个新连接
      per: second
      per_ip: true
      max_concurrent: 64  # 每源最多 64 个并发连接
    comment: 抗慢速攻击与新连接洪泛

  # ---- 本机管理面（务必保留，否则会把自己锁在门外）----
  - id: ssh-from-lan
    priority: 300
    src_zone: lan
    dst_zone: local
    proto: tcp
    dst_port: ["22"]
    state: [new, established]
    action: accept
    limit: {rate: 10, per: minute, burst: 20, per_ip: true}
    comment: 仅允许内网 SSH 管理

  - id: icmp-from-lan
    priority: 310
    src_zone: lan
    dst_zone: local
    proto: icmp
    action: accept
    limit: {rate: 10, per: second, burst: 20}
    comment: 限速 ICMP，兼顾诊断与抗洪

  # ---- 丢弃非法状态包 ----
  - id: drop-invalid
    priority: 900
    src_zone: any
    dst_zone: any
    state: [invalid]
    action: drop
    comment: 丢弃非法连接状态

nat_rules:
  # DMZ 内的 Web 服务器通过网关的 8080 端口对外提供服务
  - id: dmz-web
    priority: 100
    kind: dnat
    proto: tcp
    src_zone: wan
    match_port: "8080"
    to_addr: 192.168.20.10
    to_port: "80"
    comment: 对外暴露 DMZ Web

  # 内网与 DMZ 出访时做源地址伪装
  - id: masq-wan
    priority: 200
    kind: masquerade
    out_zone: wan
    comment: 出网口伪装

default:
  # 输入/转发默认拒绝；输出放行（本机主动发起的流量）。
  input: drop
  forward: drop
  output: accept

ban_settings:
  timeout: 24h
  whitelist:
    - 10.0.0.0/8
    - 127.0.0.0/8
