# 第一阶段（只观察）策略 —— 叠加在已有防火墙之上
#
# 特点：**不加任何过滤规则**。
#
# 本工具在这台机器上的角色是"额外的检测与封禁层"：
#   - 放行/拒绝的默认策略仍由既有防火墙（ufw / iptables）决定；
#   - 本工具只做两件事：自动封禁（写进自己的集合）+ 可选的限速；
#   - 它的链挂在更高优先级（input_priority: 10），在既有防火墙**之后**执行，
#     所以既有防火墙放行的流量才会到达这里，drop 才生效。
#
# 实测确认（nft 1.0.9）：同一钩子上的多条基础链按优先级依次执行，
# 前一条链的 accept 不会阻止后一条链继续判定，而 drop 是终局。
#
# 第一阶段把 rules 留空，配合 auto_ban.enabled: false：
#   - 规则集里只有空的封禁集合 + conntrack 状态检查，对流量几乎无影响；
#   - 检测器照常工作，把"谁达到了阈值"记录下来但不真封；
#   - 跑几天之后看 `fw ban offenders`，确认不会误封监控探针或你自己的 IP，
#     再把 auto_ban.enabled 打开。
#
# ★ 上线顺序：
#   1. 部署本文件（rules 为空），auto_ban.enabled: false
#   2. 观察 3–7 天：fw ban offenders / fw ban export
#   3. 确认无误后，把 auto_ban.enabled 改成 true 并重启
#   4. 再观察一周，才考虑在 rules 里加限速规则

version: 1

rules: []

default:
  # 关键：input 必须是 accept。
  #
  # 本工具是叠加层，不是替代品。设成 drop 会把既有防火墙放行的流量也一并丢掉
  # —— 包括你自己的 SSH。
  input: accept
  # 主机模式不生成 forward 链，这个字段不起作用。
  forward: accept
  output: accept

ban_settings:
  timeout: 24h
  whitelist:
    # ★ 上线前把你自己的管理 IP / 网段加进来。
    #   ！！！这一条写错，自动封禁打开后可能把你自己关在门外！！！
    - 127.0.0.0/8
    - "::1/128"
    # - 203.0.113.7
    # - 198.51.100.0/24
