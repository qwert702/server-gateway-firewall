# fwdd 守护进程配置示例
#
# 复制到 /etc/fwdd/config.yaml（Linux）或 %ProgramData%\fwdd\config.yaml（Windows）。

# HTTP 管理接口。默认只监听回环；若改成 0.0.0.0 则必须同时设置 token。
listen: 127.0.0.1:8080

# Unix 域套接字。Linux 上推荐只保留套接字并关闭 TCP；
# Windows 不支持时留空即可。
socket: ""

# 部署形态
#
#   gateway —— 网关/路由器型：跨网段转发、NAT、多网卡。
#              会生成 forward 链与两条 nat 链。适合做 LAN↔WAN 之间的网关。
#   host    —— 主机型：只保护本机，不做转发、不做 NAT。
#              只生成 input / output 两条链，**不注册 forward 链**。
#
# 单网卡的普通服务器（跑 nginx/数据库/应用）应该用 host。
#
# 为什么这件事很重要：fwdd 的链优先级是 filter(0)，与 Docker、firewalld 的链
# **同钩子同优先级**，而 nft 里这种情形的求值顺序是未定义的。网关模式会给
# forward 挂 policy drop，装在有 Docker 的机器上时容器网络会不会被打断
# 是看运气的 —— 比确定会坏更难排查。host 模式不注册 forward 链，从根上避开。
mode: gateway

# 后端：nftables（生产）| mock（离线演示与单测）
backend: nftables

# nft 表名与地址族。inet 同时覆盖 IPv4/IPv6。
table: fw
family: inet

# 运行时数据目录。SQLite 数据库默认放在这里（<data_dir>/fwdd.db）。
data_dir: /var/lib/fwdd

# 覆盖数据库路径；留空则使用 <data_dir>/fwdd.db。
db_path: ""

# 关闭持久化：策略与封禁只存在于内存，重启即遗忘。仅用于演示与测试。
disable_persist: false

# 声明式策略基线。注意：只在该数据库尚无策略（首次启动）时作为初始期望状态，
# 之后修改本文件不会生效 —— 数据库中的版本优先。要强制覆盖请启动时加 -import-policy。
policy_file: /etc/fwdd/policy.yaml

# API 令牌。非回环监听时必填；Linux 上建议 0600 存放于 /etc/fwdd/token。
token: ""

log_level: info

# 内核网络参数管理。
#
# 设为 true 时，启动会写入下面 sysctls 的参数；设为 false（默认）时只读取检查，
# 发现不一致就告警，不擅自改动内核。
#
# 为什么值得关注：网关型防火墙依赖 net.ipv4.ip_forward=1。这个开关没打开时，
# 规则集看起来完全正确、nft 也正常加载，但跨网段流量根本不会到达 forward 钩子 ——
# 表现为"策略写了却不生效"，而且极难排查。
manage_sysctls: false

# 留空则使用网关推荐基线：
#   net.ipv4.ip_forward = 1       转发开关（网关的绝对前提）
#   net.ipv4.tcp_syncookies = 1   抗 SYN 洪泛
#   net.ipv4.conf.all.rp_filter = 0   多宿主/非对称路由场景下避免误丢包
sysctls: []
#  sysctls:
#    - {key: net.ipv4.ip_forward, value: "1"}
#    - {key: net.ipv4.tcp_syncookies, value: "1"}
#    - {key: net.ipv4.conf.all.rp_filter, value: "0"}

# 危险变更兜底：开启后 apply 需在窗口内 confirm，否则自动回滚。
# 强烈建议在远程运维的机器上开启。
#
# 例外：启动时从 policy_file 恢复不受此约束 —— 本地策略文件是可信基线，
# 无人值守重启若还要等确认，超时回滚会把防火墙规则整个撤掉。
commit_confirm:
  enabled: false
  timeout: 60s

# ---- 自动封禁 ----
#
# 强烈建议先用 enabled: false 跑一段时间：此时检测器照常工作、照常记录
# 达到阈值的地址，只是不真的封。看一下"被封准了没有"再打开开关。
# 误封一个有合法用途的地址（监控探针、NAT 出口、爬虫）比漏封更难收拾。
auto_ban:
  enabled: false

  # 判定窗口与阈值：窗口内累计权重达到 threshold 即封禁。
  window: 10m
  threshold: 20

  # 封禁时长：首次 base_ttl，每多违规一次乘以 multiplier，上限 max_ttl；
  # 超过 strike_reset_after 没有新违规则计数清零。
  base_ttl: 10m
  multiplier: 2
  max_ttl: 24h
  strike_reset_after: 24h

  # 白名单地址永不封禁。不配则至少包含本机回环，避免误判封掉管理面。
  whitelist:
    - 127.0.0.0/8
    - ::1/128
    # - 10.0.0.0/8          # 内网
    # - 203.0.113.7         # 你的跳板机 / 监控

  # conntrack 检测：单源新建连接速率与并发连接数。
  conntrack:
    enabled: false
    path: /proc/net/nf_conntrack
    interval: 10s
    max_new_per_interval: 100   # 一个采样周期内新建连接数上限
    max_concurrent: 200         # 并发连接数上限

  # 日志检测：命中特征的来源地址计入判罚。
  logs: []
  #  logs:
  #    - path: /var/log/auth.log          # 留空 patterns 则用内置特征集
  #    - path: /var/log/kern.log
  #      patterns:
  #        - {name: ssh-auth-fail, regex: 'Failed password for .*? from (\S+)', weight: 2}
  #
  # 自定义特征的正则必须**恰好含一个捕获组**，捕获的就是要封的地址。
  # 内置特征：ssh-auth-fail / ssh-invalid-user / ssh-max-attempts / nft-limit
  #
  # 关于 nft-limit：本工具生成的限速规则会打内核日志，特征从 SRC= 提取地址，
  # 因此"某地址持续触发限速"会直接进入自动封禁判罚。

# ---- 告警推送 ----
#
# 为空表示不推送，只在日志和界面上看。
#
# 配置完先跑一次 `fw alert test` 验证通道通不通 —— 不要等真被攻击时
# 才发现 webhook 地址写错了。
#
# 同一事件（类型 + IP）在 alert_cooldown 内只发一次，重复的会合并计数。
# 一次端口扫描能瞬间产生几十条封禁，逐条推送会把你淹没，然后就没人看了。
alert_cooldown: 5m

alerts: []
#  alerts:
#    # 企业微信群机器人（钉钉把 format 换成 dingtalk 即可，格式相同）
#    - type: webhook
#      format: wecom
#      url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=你的key"
#
#    # 飞书群机器人
#    - {type: webhook, format: feishu, url: "https://open.feishu.cn/open-apis/bot/v2/hook/你的id"}
#
#    # Telegram Bot（chat_id 必填）
#    - {type: webhook, format: telegram, chat_id: "123456", url: "https://api.telegram.org/bot<token>/sendMessage"}
#
#    # 自建告警系统：直接 POST 结构化 JSON 事件
#    - {type: webhook, url: "https://your-endpoint/alerts", token: "可选 Bearer 令牌"}
#
#    # 邮件。465 端口用 implicit_tls: true；587 端口用 STARTTLS 则省略该项。
#    - type: smtp
#      addr: smtp.qq.com:465
#      implicit_tls: true
#      username: you@qq.com
#      password: "邮箱授权码，不是登录密码"
#      from: you@qq.com
#      to: [you@qq.com]
#      min_severity: warn      # 这个通道只收 warn 及以上
#
#    # 本地脚本兜底。事件内容通过环境变量传（FWDD_IP / FWDD_KIND / ...）
#    # 与 stdin 的 JSON，**不拼进命令行** —— 那些内容来自外部输入。
#    - {type: command, command: /usr/local/bin/notify.sh}

